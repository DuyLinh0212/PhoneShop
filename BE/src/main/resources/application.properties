spring.application.name=WebBanPhone
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PhoneShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
app.jwt.secret=replace-this-with-a-very-long-secret-key-please-change-in-production
app.jwt.expiration-ms=86400000
